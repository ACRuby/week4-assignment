<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mahjong Teacher</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>Mahjong Teacher</h1>
      <p>American Mahjong (NMJL) basics — answers come only from a fixed knowledge base, no external AI.</p>
    </header>
    <div id="chat-log"></div>
    <form id="chat-form">
      <input id="chat-input" type="text" placeholder="Ask about setup, the Charleston, turns, winning..." autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </div>

  <script src="knowledge-base.js"></script>
  <script src="script.js"></script>
</body>
</html>
