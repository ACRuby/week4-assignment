<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mahjong Teacher</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>Mahjong Teacher</h1>
      <p>American Mahjong (NMJL) basics — powered by Claude, grounded in this project's own knowledge base.</p>
    </header>

    <div id="api-key-bar">
      <label for="api-key-input">Anthropic API key</label>
      <input id="api-key-input" type="password" placeholder="sk-ant-..." autocomplete="off" />
      <span id="api-key-status"></span>
    </div>
    <p id="api-key-note">
      Stored only in this browser's local storage — never sent anywhere but
      api.anthropic.com, and never committed to this repo. Clear it any time by
      emptying the field.
    </p>

    <div id="chat-log"></div>
    <form id="chat-form">
      <input id="chat-input" type="text" placeholder="Ask about setup, the Charleston, turns, winning..." autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </div>

  <script src="knowledge-base.js"></script>
  <script src="claude-chat.js"></script>
</body>
</html>
